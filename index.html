<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>第3回ヒコシャメデル写真展「オレンジ&ゴールド」</title>
  <style>
    html {
      height: 100vh;
      height: 100dvh;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      border: 0;
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <iframe id="siteFrame" src="https://script.google.com/macros/s/AKfycbyE7Y46b3JiPEHC03kr0WbbSUEskyQC8aTlqV18cokY_k-Q6ysHR26-fhtSz_S3_6cc/exec"></iframe>
  <script>
    // 読み込み直後にレイアウトを強制的に再計算させる(スリープ復帰と同じ効果を狙う)
    window.addEventListener('load', function () {
      var frame = document.getElementById('siteFrame');
      setTimeout(function () {
        frame.style.display = 'none';
        void frame.offsetHeight;
        frame.style.display = 'block';
      }, 300);
    });
  </script>
</body>
</html>
