<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>第3回ヒコシャメデル写真展「オレンジ&ゴールド」</title>
  <style>
    html {
      height: 100vh;
      height: 100dvh;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    iframe {
      border: 0;
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <iframe id="siteFrame" src=""></iframe>
  <script>
    var BASE_URL = "https://script.google.com/macros/s/AKfycbyE7Y46b3JiPEHC03kr0WbbSUEskyQC8aTlqV18cokY_k-Q6ysHR26-fhtSz_S3_6cc/exec";
    // このページ自身のURLについている ?work=番号 を、中のサイトにそのまま渡す
    var frame = document.getElementById('siteFrame');
    frame.src = BASE_URL + window.location.search;

    function forceRelayout() {
      frame.style.display = 'none';
      void frame.offsetHeight;
      frame.style.display = 'block';
    }
    window.addEventListener('load', function () {
      [100, 400, 800, 1500].forEach(function (delay) {
        setTimeout(forceRelayout, delay);
      });
    });
    window.addEventListener('resize', forceRelayout);
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) forceRelayout();
    });
  </script>
</body>
</html>
